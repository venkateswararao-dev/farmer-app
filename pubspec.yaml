name: farmers_mobile_app
description: "Kerala Farmers Mobile App — AI Voice Assistant, Leaf Disease Detection, Mandi Prices & Weather Advisory"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3

  # Storage & Preferences
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.3.2

  # Images & UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2

  # Voice Assistant
  speech_to_text: ^7.4.0
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
